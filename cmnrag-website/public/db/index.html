<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中国气象报资料检索</title>
  <style>
    :root { --ink:#14213d; --muted:#667085; --line:#dce3ec; --blue:#155eef; --bg:#f6f8fb; --card:#fff; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
    header{background:#123b72;color:white;padding:26px max(24px,calc((100vw - 1180px)/2));box-shadow:0 2px 8px #071b3930} h1{font-size:24px;margin:0 0 8px;font-weight:700} header p{margin:0;color:#d5e5ff;font-size:14px}
    main{max-width:1180px;margin:28px auto;padding:0 24px}.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 2px 8px #15233a0b;margin-bottom:20px}
    label{font-size:13px;font-weight:650;display:block;margin-bottom:6px;color:#344054}input,select{width:100%;border:1px solid #bfc9d8;border-radius:7px;background:#fff;padding:10px 11px;font:14px inherit;color:var(--ink)}.facet-field{position:relative}.facet-menu{position:absolute;z-index:10;top:100%;left:0;right:0;max-height:252px;overflow:auto;margin-top:4px;padding:4px;background:#fff;border:1px solid #bfc9d8;border-radius:7px;box-shadow:0 8px 16px #10182824;display:none}.facet-menu.open{display:block}.facet-option{display:flex;width:100%;align-items:flex-start;justify-content:space-between;gap:12px;border:0;border-radius:5px;background:transparent;color:var(--ink);padding:8px;text-align:left;font:13px inherit;cursor:pointer}.facet-option:hover{background:#f2f6fc}.facet-option-name{line-height:1.45}.facet-option-count{white-space:nowrap;color:var(--muted)}
    .search{display:grid;grid-template-columns:1fr 115px;gap:10px;margin-bottom:18px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.span2{grid-column:span 2}.actions{display:flex;gap:10px;margin-top:18px}button{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:10px 17px;font:14px inherit;font-weight:650;cursor:pointer}button.secondary{background:#fff;color:#155eef;border:1px solid #b7ccff}
    .hint{font-size:13px;color:var(--muted);margin:0}.summary{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}.result{display:grid;grid-template-columns:1fr auto;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:17px;margin:10px 0;cursor:pointer}.result:hover{border-color:#84adff;box-shadow:0 2px 8px #155eef15}.title{font-size:17px;font-weight:700;margin-bottom:9px}.meta{font-size:13px;color:#526174;display:flex;gap:9px;flex-wrap:wrap}.pill{border-radius:99px;padding:2px 8px}.page-pill{background:#eef3fa;color:#344e72}.author-pill{background:#f5efff;color:#6941c6}.column-pill{background:#eafaf1;color:#16794b}.region-pill{background:#fff4e8;color:#b54708}.empty{padding:42px 16px;text-align:center;color:var(--muted)}
    dialog{border:0;border-radius:12px;max-width:900px;width:calc(100% - 32px);padding:0;box-shadow:0 16px 50px #10182866}dialog::backdrop{background:#10182880}.dialog-head{display:flex;justify-content:space-between;gap:14px;padding:20px 24px;border-bottom:1px solid var(--line)}.dialog-head h2{font-size:20px;margin:0}.close{background:transparent;color:#344054;padding:0;font-size:25px}.article-meta{padding:12px 24px;background:#f8fafc;font-size:13px;line-height:1.9;color:#475467}.content{white-space:pre-wrap;padding:24px;line-height:1.85;font-size:16px;max-height:65vh;overflow:auto}.notice{color:#b42318;font-size:13px;margin-top:12px;display:none}
    .ai-fab{position:fixed;right:26px;bottom:26px;z-index:20;border-radius:999px;box-shadow:0 8px 22px #123b7250;padding:13px 20px}.ai-drawer{position:fixed;z-index:50;top:0;right:0;height:100dvh;width:min(480px,100vw);background:#fff;box-shadow:-12px 0 30px #10182830;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}.ai-drawer.open{transform:translateX(0)}.chat-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.chat-head h2{font-size:18px;margin:0}.chat-scope{padding:10px 20px;background:#f8fafc;color:#475467;font-size:13px;border-bottom:1px solid var(--line)}.chat-log{flex:1;overflow:auto;padding:18px;background:#f6f8fb;display:flex;flex-direction:column;gap:12px}.chat-message{max-width:92%;padding:11px 13px;border-radius:12px;white-space:pre-wrap;line-height:1.65;font-size:14px}.chat-message.user{align-self:flex-end;background:#155eef;color:#fff;border-bottom-right-radius:3px}.chat-message.assistant{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}.chat-sources{align-self:flex-start;width:92%;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px}.chat-input{padding:14px;border-top:1px solid var(--line);display:flex;gap:8px}.chat-input input{flex:1}.chat-input button{white-space:nowrap}.chat-new{font-size:13px;padding:7px 10px}.chat-empty{font-size:14px;color:var(--muted);text-align:center;margin:auto 20px}
    .province-panel h2{font-size:20px;margin:0 0 5px}.province-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.province-head p{margin:0;color:var(--muted);font-size:13px}.province-toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:16px}.province-toolbar>div{min-width:145px}.province-toolbar .quick-ranges{display:flex;gap:7px;flex-wrap:wrap}.province-toolbar .quick-ranges button{padding:8px 12px}.province-toolbar .quick-ranges button.secondary{color:#344054;border-color:#bfc9d8}.province-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:17px}.province-stat{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:12px 14px}.province-stat small{display:block;color:var(--muted);font-size:12px}.province-stat strong{display:block;margin-top:4px;font-size:22px}.province-stat.top strong{font-size:17px}.province-map-wrap{position:relative;margin-top:16px;background:#93c5f0;border-radius:10px;overflow:hidden}.province-map{display:block;width:100%;height:clamp(420px,58vw,700px)}#province-inset{position:absolute;right:14px;bottom:14px;width:130px;line-height:0;border-radius:4px;overflow:hidden;box-shadow:0 1px 5px #10182830}#province-inset svg{display:block;width:100%;height:auto}.province-map .province-shape{cursor:pointer;transition:filter .12s,stroke-width .12s}.province-map .province-shape:hover{filter:brightness(1.06)}.province-map .province-group.active .province-shape{stroke:#155eef;stroke-width:.13}.province-map text{pointer-events:none;user-select:none}.province-map .province-label{font-weight:650}.province-map .province-count{font-weight:800}.province-tooltip{position:absolute;z-index:2;display:none;pointer-events:none;background:#123b72;color:#fff;border-radius:6px;padding:7px 10px;font-size:13px;white-space:nowrap;box-shadow:0 4px 12px #10182830}.province-detail{min-height:27px;margin:11px 0 0;font-size:13px;color:#475467}.province-detail a{color:var(--blue)}
    @media(max-width:760px){.filters{grid-template-columns:repeat(2,1fr)}.span2{grid-column:span 2}main{padding:0 13px}.panel{padding:16px}.result{grid-template-columns:1fr}.search{grid-template-columns:1fr}.summary{align-items:flex-start;gap:8px;flex-direction:column}.province-head{display:block}.province-stats{grid-template-columns:repeat(2,1fr)}.province-map{height:500px}.province-toolbar>div{min-width:130px}}
    /* 顶部导航栏（静态内联；auth.js 同款兜底）*/
    #auth-bar{background:#0d2b52;color:#d5e5ff;font-size:13.5px;box-shadow:0 2px 8px #071b3930;position:sticky;top:0;z-index:40}
    #auth-bar .auth-bar-inner{max-width:1180px;margin:0 auto;padding:10px 24px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
    #auth-bar .auth-left{justify-self:start}
    #auth-bar .auth-nav{justify-self:center;display:flex;gap:6px;align-items:center}
    #auth-bar .auth-right{justify-self:end;display:flex;gap:14px;align-items:center}
    #auth-bar .auth-home{color:#a8c7ff;text-decoration:none;font-weight:650;white-space:nowrap;padding:6px 0}
    #auth-bar .auth-home:hover{color:#fff}
    #auth-bar .auth-link{color:#d5e5ff;text-decoration:none;cursor:pointer;background:none;border:none;font-size:13.5px;padding:6px 12px;border-radius:6px;white-space:nowrap}
    #auth-bar .auth-link:hover{color:#fff;background:#ffffff1a}
    #auth-bar .auth-link.active{color:#fff;background:#ffffff1f;font-weight:650}
    #auth-bar .auth-name{color:#cfe2ff;white-space:nowrap}
    #auth-bar .auth-btn{padding:6px 0}
    @media(max-width:860px){#auth-bar .auth-bar-inner{grid-template-columns:1fr auto;padding:8px 14px;gap:6px 12px}#auth-bar .auth-nav{grid-column:1/-1;grid-row:2;justify-self:center}}
  </style>
</head>
<body>
<div id="auth-bar"><div class="auth-bar-inner"><div class="auth-left"><a class="auth-home" href="/">‹ 返回主页</a></div><nav class="auth-nav"><a class="auth-link" href="/db">报纸资料库</a><a class="auth-link" href="/schedule">排班系统</a></nav><div class="auth-right"></div></div></div>
<header><h1>中国气象报资料检索</h1><p>支持按关键词搜索，按日期、版面、版头、栏目、地区、作者精确筛选，基于筛选内容与AI对话。<br>当前覆盖7月1日至今内容，最新一期报纸中午前后更新（需在电子报更新后），计划逐步补完2026年内容。</p></header>
<main>
  <section class="panel">
    <form id="search-form">
      <div class="search"><div><label for="q">关键词</label><input id="q" name="q" placeholder="搜索标题或正文" /></div><div style="align-self:end"><button type="submit">检索</button></div></div>
      <div class="filters">
        <div><label for="date-from">起始日期</label><input id="date-from" type="date" name="date_from" /></div><div><label for="date-to">结束日期</label><input id="date-to" type="date" name="date_to" /></div>
        <div><label for="page">版面</label><select id="page" name="page"><option value="">全部版面</option><option>一版</option><option>二版</option><option>三版</option><option>四版</option></select></div>
        <div class="facet-field"><label for="theme">版头</label><input id="theme" name="theme" autocomplete="off" placeholder="输入版头名称的一部分，或从候选中选择" /><div id="theme-options" class="facet-menu"></div></div>
        <div class="span2 facet-field"><label for="column">栏目</label><input id="column" name="column" autocomplete="off" placeholder="输入栏目名称的一部分，或从候选中选择" /><div id="column-options" class="facet-menu"></div></div>
        <div><label for="region">主体地区</label><input id="region" name="region" placeholder="如：河北、唐山、沙河" /></div><div><label for="author">作者</label><input id="author" name="author" placeholder="姓名" /></div>
      </div>
      <div class="actions"><button type="submit">应用筛选</button><button type="button" class="secondary" id="reset">清除条件</button></div>
      <p class="notice" id="notice"></p>
    </form>
  </section>
  <section class="panel province-panel">
    <div class="province-head"><div><h2>各省发稿量</h2><p>真实省界的块状拼图地图；颜色越深表示当前周期发稿越多。点击省块可下钻到该省稿件。</p></div></div>
    <div class="province-toolbar">
      <div><label for="stats-from">起始日期</label><input id="stats-from" type="date" /></div>
      <div><label for="stats-to">结束日期</label><input id="stats-to" type="date" /></div>
      <div class="quick-ranges"><button type="button" class="secondary" data-stats-range="1">近一个月</button><button type="button" class="secondary" data-stats-range="3">近三个月</button><button type="button" class="secondary" data-stats-range="0">全部</button></div>
      <button type="button" id="apply-stats">应用周期</button>
    </div>
    <div class="province-stats"><div class="province-stat"><small>周期内发稿总量</small><strong id="st-total">-</strong></div><div class="province-stat"><small>带地区稿件</small><strong id="st-region">-</strong></div><div class="province-stat"><small>全国/跨省稿件</small><strong id="st-national">-</strong></div><div class="province-stat top"><small>发稿最多省份</small><strong id="st-top">-</strong></div></div>
    <div class="province-map-wrap"><svg id="province-map" class="province-map" role="img" aria-label="各省发稿量地图"></svg><div id="province-inset" aria-label="南海诸岛"></div><div id="province-tooltip" class="province-tooltip"></div></div>
    <p id="province-detail" class="province-detail">正在加载统计图…</p>
  </section>
  <div class="summary"><p class="hint" id="summary">输入条件后检索资料。</p><p class="hint">全文阅读不消耗 AI 额度</p></div>
  <section id="results"></section>
  <div class="empty" id="more-results" hidden><button type="button" id="load-more">加载更多</button></div>
</main>
<button class="ai-fab" id="open-ai" type="button">问 AI</button>
<aside class="ai-drawer" id="ai-drawer" aria-label="AI 综合问答">
  <div class="chat-head"><h2>AI 综合问答</h2><div><button type="button" class="secondary chat-new" id="new-chat">新建对话</button><button class="close" aria-label="关闭" id="close-ai">×</button></div></div>
  <div class="chat-scope" id="chat-scope">当前范围：全部稿件</div>
  <section class="chat-log" id="chat-log"><p class="chat-empty">输入问题开始问答。每一轮都会在当前筛选范围内重新检索原稿。</p></section>
  <p class="notice" id="ai-notice"></p>
  <div class="chat-input"><input id="ai-question" placeholder="例如：这些报道反映了哪些做法？" /><button type="button" id="ask-ai">发送</button></div>
</aside>
<dialog id="article-dialog"><div class="dialog-head"><h2 id="article-title"></h2><button class="close" aria-label="关闭" id="close-dialog">×</button></div><div class="article-meta" id="article-meta"></div><article class="content" id="article-content"></article></dialog>
<script>
const form=document.querySelector('#search-form'), results=document.querySelector('#results'), summary=document.querySelector('#summary'), notice=document.querySelector('#notice'), dialog=document.querySelector('#article-dialog'), moreResults=document.querySelector('#more-results'), loadMore=document.querySelector('#load-more'), columnInput=document.querySelector('#column'), columnOptions=document.querySelector('#column-options'), themeInput=document.querySelector('#theme'), themeOptions=document.querySelector('#theme-options'), aiQuestion=document.querySelector('#ai-question'), askAi=document.querySelector('#ask-ai'), aiNotice=document.querySelector('#ai-notice'), chatLog=document.querySelector('#chat-log'), drawer=document.querySelector('#ai-drawer'), chatScope=document.querySelector('#chat-scope'), openAi=document.querySelector('#open-ai'), closeAi=document.querySelector('#close-ai'), newChat=document.querySelector('#new-chat');
let searchOffset=0;let searchTotal=0;
const text=(v,label)=>Array.isArray(v)?(v.join('、')||`无${label}`):(v||`无${label}`);
function params(){const data=new FormData(form), p=new URLSearchParams();for(const [k,v] of data){if(v.trim())p.append(k,v.trim())}return p}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderItems(items){return items.map(x=>`<div class="result" data-id="${esc(x.article_id)}"><div><div class="title">${esc(x.title)}</div><div class="meta"><span>${esc(x.published_date)}</span><span class="pill page-pill">${esc(x.page)}</span><span class="pill author-pill">${esc(text(x.author,'作者'))}</span><span class="pill column-pill">${esc(text(x.column_name,'栏目'))}</span><span class="pill region-pill">${esc(text(x.region,'地区'))}</span></div></div><div class="hint">阅读全文 ›</div></div>`).join('')}
async function search(append=false){notice.style.display='none';if(!append){searchOffset=0;results.innerHTML='<div class="empty">正在检索…</div>';moreResults.hidden=true}try{const p=params();p.set('limit','50');p.set('offset',String(searchOffset));const r=await fetch('/api/articles?'+p);const d=await r.json();if(!r.ok)throw new Error(d.error||'请求失败');searchTotal=d.total;searchOffset+=d.items.length;summary.textContent=`共找到 ${d.total} 篇稿件 · 已显示 ${searchOffset} 篇`;if(!append)results.innerHTML=d.items.length?renderItems(d.items):'<div class="empty">没有符合条件的稿件。</div>';else results.insertAdjacentHTML('beforeend',renderItems(d.items));moreResults.hidden=!d.has_more;if(d.has_more)loadMore.textContent=`加载更多（还有 ${d.total-searchOffset} 篇）`}catch(e){if(!append)results.innerHTML='';notice.textContent='检索失败：'+e.message;notice.style.display='block'}}
async function article(id){const r=await fetch('/api/articles/'+encodeURIComponent(id)), a=await r.json();if(!r.ok)return;document.querySelector('#article-title').textContent=a.title;document.querySelector('#article-meta').innerHTML=`日期：${esc(a.published_date)}　版面：${esc(a.page)}　作者：${esc(text(a.author,'作者'))}<br>版头：${esc(a.theme)}　栏目：${esc(text(a.column_name,'栏目'))}　地区：${esc(text(a.region,'地区'))}`;document.querySelector('#article-content').textContent=a.content||'原文内容未收录；该稿仅保留结构化档案信息。';dialog.showModal()}
async function loadFacetOptions(input,options,endpoint){try{const q=input.value.trim();const r=await fetch(`${endpoint}?q=${encodeURIComponent(q)}`),d=await r.json();if(!r.ok)return;options.innerHTML=d.items.map(x=>`<button type="button" class="facet-option" data-value="${esc(x.value)}"><span class="facet-option-name">${esc(x.value)}</span></button>`).join('');options.classList.toggle('open',d.items.length>0)}catch{}}
function chooseFacet(event,input,options){const option=event.target.closest('.facet-option');if(!option)return;input.value=option.dataset.value;options.classList.remove('open');}
let conversation=[];let scopeKey='';
function currentFilters(){return Object.fromEntries(new FormData(form).entries())}
function scopeText(filters){const entries=Object.entries(filters).filter(([,v])=>String(v).trim());return entries.length?`当前范围：${entries.map(([k,v])=>({date_from:'起始日期',date_to:'结束日期',page:'版面',theme:'版头',column:'栏目',region:'地区',author:'作者',q:'关键词'}[k]||k)+`“${v}”`).join(' · ')}`:'当前范围：全部稿件'}
function appendMessage(role,content){const node=document.createElement('article');node.className=`chat-message ${role}`;node.textContent=content;chatLog.append(node);chatLog.scrollTop=chatLog.scrollHeight;return node}
function resetConversation(message='输入问题开始问答。每一轮都会在当前筛选范围内重新检索原稿。'){conversation=[];chatLog.innerHTML=`<p class="chat-empty">${esc(message)}</p>`}
function ensureScope(){const filters=currentFilters(),key=JSON.stringify(filters);chatScope.textContent=scopeText(filters);if(scopeKey&&scopeKey!==key)resetConversation('检索范围已变更，已开启新对话。');scopeKey=key;return filters}
async function askQuestion(){const question=aiQuestion.value.trim();if(!question)return;const filters=ensureScope();aiNotice.style.display='none';chatLog.querySelector('.chat-empty')?.remove();appendMessage('user',question);aiQuestion.value='';const waiting=appendMessage('assistant','正在检索原稿并生成回答…');askAi.disabled=true;try{const r=await fetch('/api/answer',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question,filters,history:conversation})});const d=await r.json();if(!r.ok){if(d.error==='ai_daily_limit')throw new Error('今日 AI 问答额度已用完');throw new Error(d.error||'AI 问答暂时不可用')}waiting.textContent=d.answer;conversation.push({role:'user',content:question},{role:'assistant',content:d.answer});if(d.sources?.length){const box=document.createElement('section');box.className='chat-sources';box.innerHTML=`<div class="hint">来源</div>${d.sources.map(s=>`<button type="button" class="facet-option ai-source" data-id="${esc(s.article_id)}">[${s.number}] ${esc(s.title)}　${esc(s.date)} ${esc(s.page)}</button>`).join('')}`;chatLog.append(box)}chatLog.scrollTop=chatLog.scrollHeight}catch(e){waiting.remove();aiNotice.textContent=e.message;aiNotice.style.display='block'}finally{askAi.disabled=false}}
form.addEventListener('submit',e=>{e.preventDefault();search()});loadMore.addEventListener('click',()=>search(true));openAi.addEventListener('click',()=>{ensureScope();drawer.classList.add('open');aiQuestion.focus()});closeAi.addEventListener('click',()=>drawer.classList.remove('open'));newChat.addEventListener('click',()=>resetConversation('已开启新对话。'));askAi.addEventListener('click',askQuestion);aiQuestion.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();askQuestion()}});chatLog.addEventListener('click',e=>{const source=e.target.closest('.ai-source');if(source)article(source.dataset.id)});columnInput.addEventListener('focus',()=>loadFacetOptions(columnInput,columnOptions,'/api/columns'));columnInput.addEventListener('input',()=>loadFacetOptions(columnInput,columnOptions,'/api/columns'));columnOptions.addEventListener('click',e=>chooseFacet(e,columnInput,columnOptions));themeInput.addEventListener('focus',()=>loadFacetOptions(themeInput,themeOptions,'/api/themes'));themeInput.addEventListener('input',()=>loadFacetOptions(themeInput,themeOptions,'/api/themes'));themeOptions.addEventListener('click',e=>chooseFacet(e,themeInput,themeOptions));document.addEventListener('click',e=>{if(!e.target.closest('.facet-field'))document.querySelectorAll('.facet-menu').forEach(menu=>menu.classList.remove('open'))});function resetAll(){HTMLFormElement.prototype.reset.call(form);['column','theme','region','author','q','date_from','date_to','page'].forEach(n=>{const e=document.querySelector(`[name="${n}"]`);if(e)e.value=''});columnOptions.innerHTML='';themeOptions.innerHTML='';columnOptions.classList.remove('open');themeOptions.classList.remove('open');results.innerHTML='';summary.textContent='输入条件后检索资料。';moreResults.hidden=true;searchOffset=0;searchTotal=0;scopeKey=''};document.querySelector('#reset').addEventListener('click',resetAll);results.addEventListener('click',e=>{const row=e.target.closest('.result');if(row)article(row.dataset.id)});document.querySelector('#close-dialog').addEventListener('click',()=>dialog.close());
</script>
<script>
(async function initProvinceMap(){
  const ns='http://www.w3.org/2000/svg', svg=document.querySelector('#province-map'), wrap=document.querySelector('.province-map-wrap'), tip=document.querySelector('#province-tooltip'), inset=document.querySelector('#province-inset');
  const from=document.querySelector('#stats-from'), to=document.querySelector('#stats-to'), detail=document.querySelector('#province-detail');
  let geometry, stats, availableTo, active;
  const outside={'香港特别行政区':[.5,1.5],'澳门特别行政区':[1.8,1.4]};
  const color=t=>{t=Math.max(0,Math.min(1,t));const a=t<.5?[234,242,255]:[21,94,239],b=t<.5?[21,94,239]:[109,63,212],k=t<.5?t*2:(t-.5)*2;return `rgb(${Math.round(a[0]+(b[0]-a[0])*k)},${Math.round(a[1]+(b[1]-a[1])*k)},${Math.round(a[2]+(b[2]-a[2])*k)})`};
  const dark=c=>{const m=c.match(/\d+/g)||[];return m.length===3&&.299*m[0]+.587*m[1]+.114*m[2]<150};
  const el=(name,attrs={})=>{const e=document.createElementNS(ns,name);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));return e};
  const points=p=>p.map(([x,y])=>`${x},${y}`).join(' ');
  function render(){
    if(!geometry||!stats)return;
    const b=geometry.bounds,pad=.8;svg.setAttribute('viewBox',`${b.minX-pad} ${b.minY-pad} ${b.maxX-b.minX+pad*2} ${b.maxY-b.minY+pad*2}`);svg.innerHTML='';
    const by=new Map(stats.provinces.map(p=>[p.name,p])), vmax=Math.max(0,...stats.provinces.map(p=>p.count));
    for(const d of geometry.provinces){
      const s=by.get(d.name)||{name:d.name,short:d.short,count:0}, fill=s.count?color(vmax?s.count/vmax:0):'#fff', group=el('g',{'data-province':d.name,class:'province-group'});
      const shape=el('polygon',{points:points(d.poly),fill,stroke:'#111827','stroke-width':'.07','vector-effect':'non-scaling-stroke'});shape.classList.add('province-shape');group.append(shape);
      for(const hole of (d.holes||[]))group.append(el('polygon',{points:points(hole),fill:'#93c5f0',stroke:'#111827','stroke-width':'.07','vector-effect':'non-scaling-stroke'}));
      const title=el('title');title.textContent=`${s.name}：${s.count}篇`;group.append(title);
      const [ax,ay]=d.anchor||[(d.bbox[0]+d.bbox[2])/2,(d.bbox[1]+d.bbox[3])/2], ink=dark(fill)?'#fff':'#111827';
      if(outside[d.name]){
        const [dx,dy]=outside[d.name],line=el('line',{x1:ax,y1:ay,x2:ax+dx,y2:ay+dy,stroke:'#111827','stroke-width':'.05'});group.append(line);
        const label=el('text',{x:ax+dx+.2,y:ay+dy+.2,fill:'#111827','font-size':'.7','font-weight':'700'});label.textContent=`${s.short} ${s.count}篇`;group.append(label);
      }else{
        const w=d.bbox[2]-d.bbox[0], nameSize=Math.max(.42,Math.min(1,w/4.2)), countSize=Math.max(.48,Math.min(1.15,w/3.4));
        const name=el('text',{x:ax,y:ay-countSize/2-.1,'text-anchor':'middle','fill':ink,'font-size':nameSize,'font-weight':'650','class':'province-label'});name.textContent=s.short;group.append(name);
        const count=el('text',{x:ax,y:ay+nameSize/2+.35,'text-anchor':'middle','fill':ink,'font-size':countSize,'font-weight':'800','class':'province-count'});count.textContent=`${s.count}篇`;group.append(count);
      }
      svg.append(group);
    }
    detail.textContent=`当前周期：${stats.from||stats.available_from||'全部'} 至 ${stats.to||stats.available_to||'全部'} · 点击省块查看稿件`;
  }
  async function loadStats(){
    const f=from.value,t=to.value;if(f&&t&&f>t){detail.textContent='起始日期不能晚于结束日期';return}
    detail.textContent='正在加载统计图…';const p=new URLSearchParams();if(f)p.set('from',f);if(t)p.set('to',t);
    try{const r=await fetch('/api/stats?'+p);const d=await r.json();if(!r.ok)throw new Error(d.error||'统计请求失败');stats=d;availableTo=d.available_to||availableTo;document.querySelector('#st-total').textContent=d.total;document.querySelector('#st-region').textContent=d.with_region;document.querySelector('#st-national').textContent=d.without_region;document.querySelector('#st-top').textContent=d.top?`${d.top.short} ${d.top.count}篇`:'-';render()}catch(e){detail.textContent='统计图加载失败：'+e.message}}
  function setRange(n){
    if(n===0){from.value='';to.value='';return loadStats()}
    if(!availableTo)return;
    const end=new Date(availableTo+'T00:00:00'), start=new Date(end);start.setMonth(start.getMonth()-n+1);const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;from.value=fmt(start);to.value=availableTo;loadStats();
  }
  document.querySelector('#apply-stats').addEventListener('click',loadStats);document.querySelectorAll('[data-stats-range]').forEach(b=>b.addEventListener('click',()=>setRange(Number(b.dataset.statsRange))));
  svg.addEventListener('mousemove',e=>{const g=e.target.closest?.('[data-province]');if(!g||!geometry)return;document.querySelectorAll('.province-group.active').forEach(x=>x.classList.remove('active'));g.classList.add('active');const d=(stats.provinces||[]).find(x=>x.name===g.dataset.province);tip.textContent=`${d?.name||g.dataset.province}：${d?.count||0}篇`;const r=wrap.getBoundingClientRect();tip.style.left=`${Math.min(e.clientX-r.left+12,r.width-150)}px`;tip.style.top=`${Math.max(8,e.clientY-r.top-38)}px`;tip.style.display='block'});
  svg.addEventListener('mouseleave',()=>{tip.style.display='none';document.querySelectorAll('.province-group.active').forEach(x=>x.classList.remove('active'))});
  svg.addEventListener('click',e=>{const g=e.target.closest?.('[data-province]');if(!g)return;const input=document.querySelector('#region');input.value=g.dataset.province;document.querySelector('#province-detail').innerHTML=`<b>${g.dataset.province}</b>：已选中，正在打开资料库筛选…`;search()});
  try{[geometry]=await Promise.all([fetch('/db/map-geometry.json').then(r=>r.json()),loadStats()]);inset.innerHTML=geometry.insetSvg||'';render()}catch(e){detail.textContent='地图加载失败：'+e.message}
})();
</script>
