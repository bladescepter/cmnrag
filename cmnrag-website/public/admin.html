<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户审批 · 采访中心工具集</title>
  <link rel="stylesheet" href="/site.css" />
</head>
<body class="admin-page">
<header><h1>用户审批</h1><p>审批注册申请，通过后可访问内部工具。</p></header>
<main id="main"></main>
<script>
  const main = document.getElementById("main");

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

  async function api(path, opts) {
    const res = await fetch(path, opts);
    return { status: res.status, data: await res.json().catch(() => ({})) };
  }

  function renderTabs(active) {
    const tabs = document.createElement("div");
    tabs.className = "tabs";
    for (const [key, label] of [["pending", "待审批"], ["approved", "已通过"], ["rejected", "已拒绝"]]) {
      const t = document.createElement("div");
      t.className = "tab" + (active === key ? " active" : "");
      t.textContent = label;
      t.addEventListener("click", () => load(key));
      tabs.appendChild(t);
    }
    return tabs;
  }

  function renderRows(items, status) {
    if (!items.length) return div("empty", status === "pending" ? "暂无待审批申请" : "暂无记录");
    const wrap = document.createElement("div");
    for (const u of items) {
      const row = document.createElement("div");
      row.className = "row";
      const top = document.createElement("div");
      top.className = "row-top";
      const un = document.createElement("span");
      un.className = "un";
      un.textContent = u.username;
      top.appendChild(un);
      if (u.role === "admin") {
        const r = document.createElement("span");
        r.className = "role admin";
        r.textContent = "管理员";
        top.appendChild(r);
      }
      row.appendChild(top);
      const meta = document.createElement("div");
      meta.className = "meta";
      const parts = [u.display_name && "显示名：" + u.display_name, u.email && "邮箱：" + u.email, u.note && "备注：" + u.note, "申请于 " + (u.created_at || "").replace("T", " ").slice(0, 19)];
      meta.textContent = parts.filter(Boolean).join(" · ");
      row.appendChild(meta);
      if (u.rejected_reason) {
        const rr = document.createElement("div");
        rr.className = "reject-reason";
        rr.textContent = "拒绝原因：" + u.rejected_reason;
        row.appendChild(rr);
      }
      if (u.status === "pending") {
        const btns = document.createElement("div");
        btns.className = "btns";
        const ok = document.createElement("button");
        ok.className = "btn ok";
        ok.textContent = "通过";
        ok.addEventListener("click", () => act(u.id, "approve", ""));
        const no = document.createElement("button");
        no.className = "btn no";
        no.textContent = "拒绝";
        no.addEventListener("click", async () => {
          const reason = window.prompt("拒绝原因（可选）", "");
          if (reason === null) return;
          await act(u.id, "reject", reason);
        });
        btns.appendChild(ok);
        btns.appendChild(no);
        row.appendChild(btns);
      }
      wrap.appendChild(row);
    }
    return wrap;
  }

  const div = (cls, text) => {
    const d = document.createElement("div");
    d.className = cls;
    d.textContent = text;
    return d;
  };

  async function act(id, action, reason) {
    const res = await api("/api/admin/users/" + id + "/" + action, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ reason }) });
    if (res.status === 200) load("pending");
    else alert(res.data.error || "操作失败");
  }

  async function load(status) {
    main.textContent = "";
    const tabs = renderTabs(status);
    main.appendChild(tabs);
    const me = await api("/api/auth/me");
    if (me.status !== 200) { location.href = "/login.html?next=" + encodeURIComponent("/admin.html"); return; }
    if (me.data.user.role !== "admin") {
      main.appendChild(div("deny", "无权访问：仅管理员可审批"));
      const back = document.createElement("a");
      back.className = "link";
      back.href = "/";
      back.textContent = "返回首页";
      main.appendChild(back);
      return;
    }
    const res = await api("/api/admin/users?status=" + status);
    if (res.status !== 200) { main.appendChild(div("empty", res.data.error || "加载失败")); return; }
    main.appendChild(renderRows(res.data.items || [], status));
  }

  load("pending");
</script>
</body>
</html>
